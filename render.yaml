# Blueprint opcional do Render: cria o banco e o site juntos.
databases:
  - name: salao-db
    plan: free
    databaseName: salaodb
    user: salao

services:
  - type: web
    name: salao-beleza
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salao-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Admin__Email
        value: admin@salao.com
      - key: Admin__Senha
        sync: false        # o Render pede o valor ao criar
      - key: App__UrlBase
        sync: false        # ex.: https://salao-beleza.onrender.com
